name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: build_debug
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_error.log

      - name: Diagnose build output (push builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set +e
          mkdir -p .ci-debug
          {
            echo "=== find app/build -name '*.apk' ==="
            find app/build -name "*.apk" 2>&1
            echo "=== build_error.log line count ==="
            wc -l /tmp/build_error.log
            echo "=== lines containing Exception/Caused by/error/FAILURE ==="
            grep -n -A2 -iE "error:" /tmp/build_error.log | head -n 150
            echo "=== first 150 lines ==="
            head -n 150 /tmp/build_error.log
          } > .ci-debug/apk_diagnosis.log 2>&1
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-debug/apk_diagnosis.log
          git commit -m "ci: capture apk diagnosis [skip ci]" || true
          git push --force origin HEAD:refs/heads/ci-diagnostics || true

      - name: Fail if debug build failed
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.build_debug.outcome == 'failure' }}
        run: exit 1

      - name: Upload Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroidUnlocked-LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Download Android testkey
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          wget -q -O testkey.pk8 "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8"
          wget -q -O testkey.x509.pem "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem"

      - name: Install apksigner
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get install -y apksigner

      - name: Sign APK with testkey
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_OUT="LeviLauncher-${GITHUB_REF_NAME}-release.apk"
          apksigner sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "$APK_IN"
          echo "APK_OUT=$APK_OUT" >> $GITHUB_ENV

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LeviLauncher Unlocked ${{ github.ref_name }}"
          files: ${{ env.APK_OUT }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}